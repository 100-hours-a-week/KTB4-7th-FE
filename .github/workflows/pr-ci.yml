name: 프론트 PR CI

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  quality:
    if: startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm run test -- --run

      - name: 프로덕션 빌드
        run: npm run build
