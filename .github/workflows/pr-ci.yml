name: 프론트 CI

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]
  push:
    branches:
      - dev

jobs:
  quality:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm run test -- --run

      - name: 프로덕션 빌드
        run: npm run build

  trigger-cd:
    name: Request Cloud auto deploy
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send deploy request to Cloud
        env:
          GH_TOKEN: ${{ secrets.CLOUD_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CLOUD_DEPLOY_DISPATCH_TOKEN is not set; auto deploy request skipped"
            exit 0
          fi
          gh api repos/100-hours-a-week/KTB4-7th-Cloud/dispatches \
            -f event_type=frontend-ci-success -f "client_payload[sha]=$GITHUB_SHA" \
            || echo "::warning::Cloud auto deploy request failed; deploy by hand"
